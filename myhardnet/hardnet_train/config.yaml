# MobileHardNet 轻量描述子训练配置。
# 训练命令：python -m hardnet_train.train --config hardnet_train/config.yaml
# 第一版保持 HardNet 的损失和 128 维输出，只替换描述子网络，
# 便于独立评估移动端结构带来的精度与速度变化。

seed: 42
output_dir: ../outputs/hardnet_train_mobile_fixed_v1

data:
  train_csv: ../hardnet_dataset/train_pairs.csv
  val_csv: ../hardnet_dataset/val_pairs.csv
  test_csv: ../hardnet_dataset/test_pairs.csv
  normalize: true
  # Windows 下使用多个常驻 worker 提前读取 patch，减少 GPU 等待磁盘/PIL 解码。
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  max_train_rows:
  max_val_rows:
  max_train_rows_per_finger:
  max_val_rows_per_finger:

model:
  architecture: mobile_hardnet
  descriptor_dim: 128
  # 小模型先使用温和 dropout，避免容量受限时正则过强。
  dropout: 0.1
  final_bn_affine: false

training:
  # 明确要求 CUDA，避免 CUDA 版 PyTorch 缺失时静默退回 CPU。
  device: cuda
  # 卷积前向使用 FP16，hardest-negative 距离矩阵和 loss 仍使用 FP32。
  mixed_precision: fp16
  channels_last: true
  cudnn_benchmark: true
  allow_tf32: true
  # 允许长程训练并保留 last.pt 续训；当前固定协议可用于稳定观察过拟合拐点。
  epochs: 500
  steps_per_epoch: 1000
  # 单手指点数不足会从已选样本重复采样补齐；整个 batch 仍不足则丢弃。伪负样本由 point_group 屏蔽。
  batch_size: 256
  # fingers_per_batch=1 时，每 batch 只选 1 根手指，全部 256 对来自同一手指的一个两图组合。
  fingers_per_batch: 32
  # Hard negative mining strategy:
  # - same_finger_allowed: allow same-finger negatives, but mask connected point_group.
  # - different_finger: only use negatives from different finger_id values.
  hard_negative_strategy: same_finger_allowed
  # 每条正样本从双向合法候选中选择距离最小的 k 个负样本；设为 1 可复现原来的 hardest-negative。
  hard_negative_top_k: 3
  # 论文 margin 是 1.0；当前指纹 patch 先保留较温和的 0.8。
  margin: 1.0
  # 长训练先禁用早停；需要时可命令行设置 --early-stop-patience。
  early_stop_patience: 0
  early_stop_min_relative_improvement: 0.002
  scheduler: warmup_cosine
  warmup_epochs: 2
  eta_min: 0.0001
  log_interval: 50

validation:
  # 与训练 sampler 完全解耦；seed 决定索引，跨 epoch/运行保持相同。
  protocol: fixed_pairs_v1
  seed: 10042
  positive_count: 16384
  same_finger_negatives_per_anchor: 32
  cross_finger_negatives_per_anchor: 32
  # 这里只控制唯一 patch 的前向批量，不改变验证距离对。
  batch_size: 256

optimizer:
  # 默认使用 SGD + Nesterov。切换为 adamw 时也要显式设置对应学习率，
  # 不会静默改写 lr，确保 resolved_config 能准确记录实验变量。
  name: sgd
  lr: 0.1
  momentum: 0.9
  nesterov: true
  # 仅 Conv/Linear 权重衰减；BatchNorm 参数和所有 bias 固定为 no-decay。
  weight_decay: 0.0001
  # 仅 AdamW 使用。
  betas: [0.9, 0.999]
  eps: 1.0e-8
