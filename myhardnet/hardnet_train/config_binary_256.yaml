# 256-bit residual binary descriptor 训练配置。
# 先加载并默认冻结浮点 teacher，再独立优化 hash head；不会覆盖浮点 checkpoint。

seed: 42
output_dir: ../outputs/models/hardnet_binary_256_fixed_in_batch_v1

data:
  train_csv: ../hardnet_dataset/train_pairs.csv
  val_csv: ../hardnet_dataset/val_pairs.csv
  normalize: true
  num_workers: 4
  pin_memory: false
  persistent_workers: true
  prefetch_factor: 2
  max_train_rows:
  max_val_rows:
  max_train_rows_per_finger:
  max_val_rows_per_finger:

backbone:
  checkpoint: ../outputs/models/hardnet_train_strong_v2_256_fixed_in_batch_v1/best.pt
  architecture: auto
  descriptor_dim: auto

binary_model:
  hash_bits: 256
  hidden_multiplier: 2.0
  dropout: 0.10
  temperature_start: 1.0
  temperature_end: 0.10
  backbone_trainable: false
  bitorder: little

binary_loss:
  metric_weight: 1.0
  teacher_similarity_weight: 0.50
  positive_consistency_weight: 0.10
  quantization_weight: 0.10
  balance_weight: 0.02
  decorrelation_weight: 0.02

training:
  device: cuda
  mixed_precision: fp16
  channels_last: true
  cudnn_benchmark: false
  allow_tf32: true
  epochs: 150
  steps_per_epoch: 1000
  batch_size: 256
  fingers_per_batch: 32
  hard_negative_strategy: same_finger_allowed
  same_finger_min_coordinate_separation_px: 16
  hard_negative_top_k: 3
  margin: 0.50
  grad_clip_norm: 5.0
  early_stop_patience: 0
  early_stop_min_relative_improvement: 0.002
  scheduler: warmup_cosine
  warmup_epochs: 2
  eta_min: 0.00001
  log_interval: 50

validation:
  # 与训练相同的多手指、单 image_pair/batch、合法候选掩码和双向 top-k 规则。
  protocol: fixed_in_batch_v1
  seed: 10042
  # auto 使用 min(验证集可用手指数, batch_size)。
  finger_count: auto
  # image_pair 不足时循环使用；过大只会增加验证耗时和指标缓存。
  batch_count: 256
  batch_size: 24
  # Hamming triplet 指标使用归一化距离，因此保留独立 margin。
  margin: 0.10

optimizer:
  name: adamw
  lr: 0.001
  weight_decay: 0.0001
  betas: [0.9, 0.999]
  eps: 1.0e-8