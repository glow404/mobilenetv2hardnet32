# 原 HardNet CPU 对照配置；与 MobileHardNet smoke 使用相同数据和训练预算。
seed: 42
output_dir: ../outputs/hardnet_train_original_fixed_v1_smoke

data:
  train_csv: ../hardnet_dataset/train_pairs.csv
  val_csv: ../hardnet_dataset/val_pairs.csv
  test_csv: ../hardnet_dataset/test_pairs.csv
  normalize: true
  num_workers: 0
  pin_memory: false
  max_train_rows: 4096
  max_val_rows:
  max_train_rows_per_finger:
  max_val_rows_per_finger: 64

model:
  architecture: hardnet
  descriptor_dim: 128
  dropout: 0.1
  final_bn_affine: false

training:
  device: cpu
  mixed_precision: fp32
  channels_last: false
  cudnn_benchmark: false
  allow_tf32: false
  epochs: 3
  steps_per_epoch: 30
  batch_size: 64
  fingers_per_batch: 1
  hard_negative_strategy: same_finger_allowed
  hard_negative_top_k: 3
  margin: 1.0
  early_stop_patience: 0
  early_stop_min_relative_improvement: 0.002
  scheduler: warmup_cosine
  warmup_epochs: 0.2
  eta_min: 0.0001
  log_interval: 10

validation:
  protocol: fixed_pairs_v1
  seed: 10042
  positive_count: 96
  same_finger_negatives_per_anchor: 8
  cross_finger_negatives_per_anchor: 8
  batch_size: 64

optimizer:
  name: sgd
  lr: 0.05
  momentum: 0.9
  nesterov: true
  weight_decay: 0.0001